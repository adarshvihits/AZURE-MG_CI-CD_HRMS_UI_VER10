name: .NET CI/CD (Azure)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'              # must match your .csproj (net8.0 -> 8.0.x)
  AZURE_WEBAPP_NAME: mg-hrms-ui     # your App Service name from Step 1
  PROJECT_PATH: ./Hrms.Lite.UI/Hrms.Lite.UI.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Add Telerik NuGet feed
        env:
          T_USER: ${{ secrets.TELERIK_NUGET_USER }}
          T_KEY: ${{ secrets.TELERIK_NUGET_KEY }}
        run: |
          dotnet nuget add source https://nuget.telerik.com/v3/index.json \
            --name TelerikFeed \
            --username "$T_USER" \
            --password "$T_KEY" \
            --store-password-in-clear-text

      - name: Test Telerik login
        env:
          T_USER: ${{ secrets.TELERIK_NUGET_USER }}
          T_KEY: ${{ secrets.TELERIK_NUGET_KEY }}
        run: |
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" -u "$T_USER:$T_KEY" https://nuget.telerik.com/v3/index.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
