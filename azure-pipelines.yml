trigger:
  branches:
    include:
    - master

pr: none

variables:
- group: Telerik
- name: buildConfiguration
  value: 'Release'

stages:
- stage: Build
  jobs:
  - job: Job
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - script: >
        dotnet nuget add source https://nuget.telerik.com/v3/index.json
        --name TelerikFeed
        --username "$(TelerikUser)"
        --password "$(TelerikPassword)"
        --store-password-in-clear-text
      displayName: 'Add Telerik NuGet source'

    - script: dotnet nuget list source
      displayName: 'Show NuGet sources'
    - script: dotnet restore Malabar_Gold_UI_V4.sln
      displayName: 'Restore'
    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.sln'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.sln'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: false
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'drop'

- stage: DeploySIT
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToSIT
    pool:
      vmImage: 'windows-latest'
    environment: 'SIT'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'Azure-Github-UI-Service-Connection'
              appType: 'webApp'
              appName: 'mg-hrms-ui'
              package: '$(Pipeline.Workspace)/drop/*.zip'